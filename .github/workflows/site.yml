name: site

# Sync guard for the documentation site (Astro/Starlight).
#
# Builds docs-site/ and runs scripts/check-doc-refs.mjs so a pull request cannot
# merge documentation that has drifted from the repository:
#
#   - the build generates the rule table from packages/core/src/validate/ and
#     fails outright if a rule file is not registered in rules/index.ts (an
#     unregistered rule never runs, and nothing else catches that).
#   - check-doc-refs.mjs catches what the build does not: a page that exists in
#     only one language, a `packages/….ts` path that was renamed, a missing
#     `#region` marker, and a rule name in prose that no longer exists
#     (`browserhive/…` names are not looked at) — `astro build` logs the
#     region one but still exits 0, so it cannot be relied on as a gate.
#
#
# Security: read-only check. It never deploys and references no secrets, so
# running on pull_request (including from forks) is safe — unlike docs.yml.

on:
  push:
    branches: [main]
    paths:
      - "packages/core/src/validate/**"
      - "docs-site/**"
      - "scripts/check-doc-refs.mjs"
      - "package.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "packages/core/src/validate/**"
      - "docs-site/**"
      - "scripts/check-doc-refs.mjs"
      - "package.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Docs sync guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      # Only docs-site dependencies (npm). The pnpm workspace is untouched: the
      # site reads packages/core's source as text, it does not compile it.
      - name: Install docs-site dependencies
        run: npm ci --prefix docs-site
      - name: Build site and verify doc references
        run: npm run site:check
