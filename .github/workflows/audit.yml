name: audit

# Known-vulnerability gate for both lockfiles: pnpm-lock.yaml (the workspace) and
# docs-site/package-lock.json (npm — `pnpm audit` never reads it).
#
# Advisories are published independently of our pull requests, so this also runs
# every day. It is a workflow of its own rather than a step of `pnpm check`: while
# the audit sat in check's && chain, every push from 2026-10-30 stopped there and
# nothing after it in the chain ran on CI.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No install: both audits read the lockfiles, not node_modules. The env
      # line is what makes that true. pnpm 11 installs dependencies before any
      # `pnpm run` when node_modules is missing (verifyDepsBeforeRun defaults to
      # `install`). It also keeps the verdict about the lockfile as committed:
      # rejecting an out-of-date lockfile is the frozen install's job in
      # check.yml, not something to re-resolve here.
      - name: Audit both lockfiles
        run: pnpm run audit
        env:
          pnpm_config_verify_deps_before_run: "false"
