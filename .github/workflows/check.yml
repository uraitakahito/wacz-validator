name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check:seaweedfs-pin runs seaweedfs/scripts/check-pin.sh against the submodule's
          # docker-compose.yml. The submodule is public, so the default token clones it.
          submodules: true
      # pnpm-setup must precede setup-node so `cache: pnpm` finds
      # pnpm on PATH when computing the cache key.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
